services:
  postgres:
    image: postgres:16-alpine
    container_name: esthypyaourt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: esthypyaourt
    ports:
      - "5432:5432"
    volumes:
      - esthypyaourt_pgdata:/var/lib/postgresql/data

volumes:
  esthypyaourt_pgdata:
